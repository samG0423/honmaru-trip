<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>本丸家行程筆記</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#2f5d62">
<style>
:root{--eta:#0b3a8c;--train:#e8def8;--bg:#f4f1ea;--ink:#222;--line:#d8d2c4;--done:#dcebdc;--cur:#ffd98a;--todo:#fff;--lodge:#dbe6f5;--pri:#2f5d62}
@media(prefers-color-scheme:dark){:root{--eta:#9cc9ff;--train:#3a3050;--bg:#1d1f1f;--ink:#eee;--line:#444;--done:#2b3d2d;--cur:#6b5420;--todo:#2a2c2c;--lodge:#27384f}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;background:var(--pri);color:#fff;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:2}
header h1{font-size:17px;margin:0;flex:1 1 100%}
button,input,textarea{font:inherit}button{border:1px solid var(--line);background:var(--todo);color:var(--ink);border-radius:8px;padding:5px 10px;cursor:pointer}
button.pri{background:var(--pri);color:#fff;border-color:var(--pri)}header button{background:#ffffff22;color:#fff;border-color:#ffffff55}
header input{padding:4px;border-radius:6px;border:0}
.wrap{display:flex;gap:12px;max-width:980px;margin:0 auto;padding:12px;align-items:flex-start}main{flex:1;min-width:0}
aside{width:170px;flex:none;position:sticky;top:96px;max-height:80vh;overflow:auto}.sh{font-weight:700;margin-bottom:6px}
.chip{display:block;width:100%;text-align:left;margin-bottom:6px;border-radius:10px}.chip small{display:block;opacity:.7}.chip.st-c-done{background:var(--done)}.chip.st-c-current{background:var(--cur)}.chip.lodge{background:var(--lodge)}
@media(max-width:700px){.wrap{display:block;padding:8px}aside{width:auto;position:static;display:flex;gap:6px;overflow-x:auto;margin-bottom:8px}.sh{display:none}.chip{width:auto;flex:none;margin:0}}
.st-todo{background:#1a5fd0;color:#fff;border-color:#0e3f94;font-weight:700}.st-current{background:#e08a00;color:#fff;border-color:#a86500;font-weight:700}.st-done{background:#6b8f6b;color:#fff;border-color:#4d6e4d;font-weight:700}
button:disabled.st-current,button:disabled.st-done{opacity:1;cursor:default}.tag.act{background:#e0d4ff;color:#2a1560;font-weight:700;font-size:14px}.chip.on{background:var(--pri);color:#fff}.tg{margin-bottom:8px}.chip.tt{font-weight:700}.chip.dd{margin-left:14px;width:calc(100% - 14px)}@media(max-width:700px){.tg{display:contents}.chip.dd{margin-left:0;width:auto}}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px;text-align:center}.cal i{font-style:normal;font-size:12px}.cd{padding:8px 0}.cd.sel{outline:3px solid #1a5fd0}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}.mini{font-size:12px;padding:2px 8px}.trow2{display:flex;gap:4px;margin:-2px 0 6px 14px}.chip.dn{font-weight:700;margin-top:10px;background:var(--lodge)}
body{padding-bottom:env(safe-area-inset-bottom);-webkit-tap-highlight-color:transparent}header{padding-top:calc(10px + env(safe-area-inset-top))}
button{min-height:38px}input,select,textarea{font-size:16px}dialog{max-height:92vh;overflow:auto}
@media(max-width:700px){header h1{font-size:15px}header{gap:6px}dialog{width:96vw}.card{padding:10px}.tr-times{font-size:34px}}
.flash{outline:3px solid #1a5fd0}
.legend{display:flex;gap:10px;font-size:13px;margin-bottom:8px;flex-wrap:wrap}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line);margin-right:4px;vertical-align:-1px}
.card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:var(--todo)}
.card.done{background:var(--done);opacity:.85}.card.current{background:var(--cur);border-color:#e0a030}.card.lodge{background:var(--lodge)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.name{font-weight:600;font-size:16px;flex:1}
.tag{font-size:12px;padding:1px 7px;border-radius:99px;border:1px solid var(--line)}.ok{background:#c8ecc8;color:#124}.warn{background:#ffe08a;color:#430}.bad{background:#f4b9b9;color:#400}
.acts{margin-top:8px}.info{margin-top:6px;font-size:13px;white-space:pre-wrap;border-top:1px dashed var(--line);padding-top:6px}
a.nav{text-decoration:none;color:#fff;font-weight:700;border-radius:8px;padding:5px 12px;background:#1a5fd0;border:1px solid #0e3f94}
dialog{border:1px solid var(--line);border-radius:14px;width:min(94vw,480px);background:var(--bg);color:var(--ink)}
dialog label{display:block;margin-top:8px;font-size:13px}dialog input[type=text],dialog input[type=number],dialog textarea{width:100%;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--todo);color:var(--ink)}
dialog select{width:100%;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--todo);color:var(--ink)}
dialog label.vlabel{font-size:20px;font-weight:700;padding:8px 10px;border:2px solid var(--pri);border-radius:10px;background:var(--cur);margin-top:12px}
.vlabel input{width:22px;height:22px;vertical-align:-4px}#vf{border-left:4px solid var(--pri);padding-left:10px;margin-top:6px}
.vt{font-size:15px;font-weight:700;background:var(--pri);color:#fff;padding:2px 10px;border-color:var(--pri)}
.eta{font-size:15px;margin-top:4px;color:var(--eta);font-weight:700}.eta small{font-weight:400;opacity:.8}
.card.train{background:linear-gradient(160deg,#0f1b3d,#1d2d63);color:#fff;border-color:#0f1b3d}.card.train button{background:#ffffff22;color:#fff;border-color:#ffffff66}
.tr-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.tr-badge{font-weight:800;padding:3px 12px;border-radius:99px;background:linear-gradient(90deg,#ff9a18,#e0245e 60%,#a43cff);font-size:15px}.tr-no{font-size:24px;font-weight:800;flex:1}
.tr-sta{font-size:24px;font-weight:800;margin:10px 0 2px}.tr-times{display:flex;align-items:flex-end;gap:12px;font-size:38px;font-weight:800;line-height:1.1;margin:4px 0 10px}.tr-times small{display:block;font-size:12px;font-weight:400;opacity:.75}.tr-times .ar{font-size:24px;opacity:.7;padding-bottom:4px}
.tr-chips{display:flex;gap:8px;flex-wrap:wrap}.tr-chip{background:#ffffff1f;border:1px solid #ffffff44;border-radius:12px;padding:6px 14px;font-size:22px;font-weight:800;min-width:90px}.tr-chip small{display:block;font-size:12px;font-weight:400;opacity:.8}.tr-chip.hl{background:linear-gradient(90deg,#ff7a18,#e0245e);border:0}.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.tab{flex:none;text-align:center;line-height:1.2}.tab.on{background:var(--pri);color:#fff}
a.nl{color:inherit;text-decoration:underline dotted;text-underline-offset:4px}
.hint{font-size:12px;color:#b05a00}
</style></head><body>
<header><h1>🏯 本丸家行程筆記</h1>
<button onclick="openTrip()">📅行程</button><button onclick="shift(-1)">◀</button><button id="dbtn" onclick="openCal()">📆 <b id="dlabel"></b></button><button onclick="shift(1)">▶</button>
<button onclick="sdlg.showModal();drawStat()">💾 存檔</button><button id="inst" style="display:none" onclick="doInst()">📲 安裝</button><button onclick="exp()">匯出</button><button onclick="document.getElementById('imp').click()">匯入</button>
<button onclick="Notification.requestPermission()">🔔通知</button><input type="file" id="imp" hidden accept=".json" onchange="imp(this)"><div id="fst" onclick="fstClick()" style="flex-basis:100%;font-size:12px;cursor:pointer;opacity:.9"></div></header>
<div class="wrap"><aside id="side"></aside><main><div class="legend"><span><i style="background:var(--done)"></i>離開(已去過)</span><span><i style="background:var(--cur)"></i>我到了(現在位置)</span><span><i style="background:var(--todo)"></i>前往(尚未到達)</span></div>
<div id="list"></div><button class="pri" onclick="edit(null,false)">＋ 新增地點</button></main></div>
<dialog id="dlg"><b id="dt"></b>
<label>Google Maps 連結<span class="row"><input type="text" id="f_url" oninput="onUrl()" style="flex:1"><button type="button" onclick="clearLink()" style="white-space:nowrap">🗑 刪除</button></span></label><div class="hint" id="hint"></div>
<label>名稱<input type="text" id="f_name"></label><div id="actBox"><label>活動名稱(例:午餐、看展)<input type="text" id="f_act"></label></div>
<label>緯度 / 經度<span class="row"><input type="number" step="any" id="f_lat" placeholder="緯度" style="flex:1"><input type="number" step="any" id="f_lng" placeholder="經度" style="flex:1"></span></label>
<div id="venueBox"><label class="vlabel"><input type="checkbox" id="f_venue" onchange="vb()"> 🏛 營運場地</label>
<div id="vf"><div class="row"><label style="flex:1">開放時間<select id="f_open"></select></label><label style="flex:1">閉館時間<select id="f_close"></select></label></div>
<div style="margin-top:10px;font-size:13px" class="row"><span style="flex:1">公休日(勾選)</span><button type="button" onclick="clrClosed()">清除重選</button></div><div class="row" id="cd"></div>
<label>營業備註<input type="text" id="f_hours" placeholder="例:國定假日休、最後入場 16:30"></label>
<label>閉館前幾分鐘提醒<input type="number" id="f_remind" value="60"></label>
<div style="margin-top:10px;font-size:13px">門票(勾選票種並填票價)</div><div id="tk"></div><div id="tkTotal" style="font-weight:700;font-size:16px;margin-top:4px">💰 總價:$0</div>
<label>門票備註(購票連結、是否已購)<textarea id="f_ticket" rows="2"></textarea></label>
<label>注意事項<textarea id="f_notes" rows="3"></textarea></label></div></div>
<div class="row" style="margin-top:12px"><button class="pri" onclick="saveForm()">儲存</button><button onclick="dlg.close()">取消</button><button id="delBtn" onclick="del()" style="margin-left:auto">刪除</button></div></dialog>
<dialog id="ldlg"><b>續住:選擇之前的住宿</b><label>住宿<select id="l_sel"></select></label><div class="row" style="margin-top:12px"><button class="pri" onclick="pickStay()">套用</button><button onclick="ldlg.close()">取消</button></div></dialog>
<dialog id="mvdlg"><b>搬移到哪一天?</b><label>日期<select id="m_sel"></select></label><div class="row" style="margin-top:12px"><button class="pri" onclick="doMove()">搬移</button><button onclick="mvdlg.close()">取消</button></div></dialog>
<dialog id="sdlg"><b>💾 資料保存</b>
<p style="font-size:13px">資料會自動存在瀏覽器內。建議再綁定一個檔案(放進「本丸家行程筆記app」資料夾),之後每次修改都會自動寫入該檔案,清除瀏覽器資料也不會遺失。需使用電腦版 Chrome / Edge;手機(Android)請改用「匯出備份」。</p>
<div id="s_stat" style="font-weight:700;margin:6px 0"></div>
<div style="display:flex;flex-direction:column;gap:8px"><button class="pri" onclick="pickNew()">📁 建立存檔檔案</button><button onclick="pickOpen()">📂 開啟既有存檔檔案</button><button onclick="regrant()">🔓 恢復檔案存取</button><button onclick="exp()">⬇ 匯出備份(下載)</button></div>
<div class="row" style="margin-top:12px"><button onclick="sdlg.close()">關閉</button></div></dialog>
<dialog id="ddlg"><b style="color:#b00020">⚠ 確認刪除</b><p id="dd_msg"></p><div class="row"><button style="background:#b00020;color:#fff" onclick="doDelTrip()">確定刪除</button><button onclick="ddlg.close()">取消</button></div></dialog>
<dialog id="cdlg"><div id="cal"></div><div class="row" style="margin-top:10px"><button onclick="cdlg.close()">關閉</button></div></dialog>
<dialog id="tdlg"><b>活動(行程)管理</b><div id="t_list" style="margin:8px 0"></div>
<div style="font-weight:700" id="t_ft">新增活動</div>
<label>活動名稱<input type="text" id="t_name" placeholder="例:本丸一家台南行"></label>
<label>開始日<input type="date" id="t_start"></label><label>結束日<input type="date" id="t_end"></label>
<div class="hint">活動的每一天會顯示在左邊該活動標籤底下;第一天顯示去程車次、最後一天顯示回程車次。</div>
<div class="row" style="margin-top:12px"><button class="pri" onclick="saveTrip()">儲存</button><button onclick="tdlg.close()">關閉</button></div></dialog>
<dialog id="trdlg"><b id="trt"></b>
<label>交通工具<select id="tr_type" onchange="stl()"><option>台鐵</option><option>高鐵</option></select></label>
<label>車次<input type="text" id="tr_no" placeholder="例:自強 123 / 高鐵 0651"></label>
<div class="row"><label style="flex:1">起站<select id="tr_from_s" onchange="stSel('tr_from')"></select><input type="text" id="tr_from" placeholder="輸入車站" style="display:none;margin-top:4px"></label><label style="flex:1">迄站<select id="tr_to_s" onchange="stSel('tr_to')"></select><input type="text" id="tr_to" placeholder="輸入車站" style="display:none;margin-top:4px"></label></div>
<label>出發時間<span class="row" id="tr_dep"></span></label><label>抵達時間<span class="row" id="tr_arr"></span></label>
<label>提醒(發車前幾分鐘)<select id="tr_rem"><option value="0">不提醒</option><option>15</option><option>30</option><option>60</option><option>90</option><option>120</option></select></label>
<div class="row"><label style="flex:1">車廂<input type="text" id="tr_car" placeholder="例:5"></label><label style="flex:1">座位<input type="text" id="tr_seat" placeholder="例:12A"></label></div>
<label>備註<input type="text" id="tr_note"></label>
<div class="row" style="margin-top:12px"><button class="pri" onclick="saveTrain()">儲存</button><button onclick="trdlg.close()">取消</button><button onclick="clearTrain()" style="margin-left:auto">清除</button></div></dialog>
<script>
const KEY='honmaru-trip-v1',$=id=>document.getElementById(id),dlg=$('dlg');
let db=JSON.parse(localStorage.getItem(KEY)||'{"days":{}}'),editing=null,isLodge=false;mig();
const pad=n=>String(n).padStart(2,'0'),fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
let date=fmt(new Date());
let wt,fh=null,fstat='';
const save=()=>{db._saved=Date.now();try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){fstat='⚠ 瀏覽器儲存失敗,請立刻匯出備份';drawStat()}clearTimeout(wt);wt=setTimeout(writeFile,400)};
const day=()=>db.days[date]||(db.days[date]={lodging:null,places:[]});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shift(n){const d=new Date(date+'T00:00');d.setDate(d.getDate()+n);date=fmt(d);render()}
function parseMaps(u){u=u.trim();const r={};
 if(/maps\.app\.goo\.gl|goo\.gl\/maps/.test(u)){r.short=true;return r}
 let m=u.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||u.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||u.match(/[?&](?:q|query|ll)=(-?\d+\.\d+),(-?\d+\.\d+)/);
 if(m){r.lat=+m[1];r.lng=+m[2]}
 m=u.match(/\/place\/([^/@?]+)/);if(m){try{r.name=decodeURIComponent(m[1].replace(/\+/g,' '))}catch(e){}}
 return r}
const mapLink=p=>/^https?:/.test(p.url||'')?p.url:p.lat!=null&&p.lng!=null?`https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name)}`;
function dist(a,b){const R=6371,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dg=r(b.lng-a.lng);
 const h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function getH(p){let o=p.open,c=p.close;if(!o&&p.hours){const m=p.hours.match(/(\d{1,2}):(\d{2})\s*[-~–]\s*(\d{1,2}):(\d{2})/);if(m){o=pad(+m[1])+':'+m[2];c=pad(+m[3])+':'+m[4]}}
 if(!o||!c)return null;const f=x=>+x.slice(0,2)*60+ +x.slice(3);return{o,c,a:f(o),b:f(c)}}
function hrs(p,any){if(!p.venue)return null;if(p.closedDays?.includes((any?new Date():new Date(date+'T00:00')).getDay()))return{t:'公休',c:'bad',b:0};const g=getH(p);if(!g||(!any&&date!==fmt(new Date())))return null;const n=new Date(),t=n.getHours()*60+n.getMinutes(),{a,b}=g;
 if(t<a||t>=b)return{t:'已打烊/未開門',c:'bad',b};if(b-t<=60)return{t:`即將打烊(${b-t}分)`,c:'warn',b};return{t:'營業中',c:'ok',b}}
const fm=m=>m>=60?`${m/60|0}小時${m%60?m%60+'分':''}`:m+'分';
function eta(a,b){if(a?.lat==null||b?.lat==null)return null;const km=dist(a,b)*1.3;return{km,walk:Math.round(km/5*60),car:Math.max(1,Math.round(km/30*60))}}
function arrive(id){const ps=day().places;ps.forEach(p=>{if(p.status==='current')p.status='done'});
 const cur=ps.find(p=>p.id===id);cur.status='current';
 let c=ps.filter(p=>p.status==='todo'&&p.lat!=null&&cur.lat!=null);
 const open=c.filter(p=>(hrs(p)||{}).c!=='bad');if(open.length)c=open;
 c.sort((a,b)=>dist(cur,a)-dist(cur,b));
 if(c.length){const b=c[0];ps.splice(ps.indexOf(b),1);ps.splice(ps.indexOf(cur)+1,0,b)}
 save();render()}
function setStatus(id,s){day().places.find(p=>p.id===id).status=s;save();render()}
function move(id,n){const ps=day().places,i=ps.findIndex(p=>p.id===id),j=i+n;if(j<0||j>=ps.length)return;[ps[i],ps[j]]=[ps[j],ps[i]];save();render()}
function card(p,lodge,o){const h=lodge?null:hrs(p),cls=lodge?'lodge':p.status;
 let info=[];const e=!lodge&&o&&p!==o&&p.status!=='current'?eta(o,p):null;if(p.venue){const g=getH(p);if(g||p.hours)info.push('🕒 營業時間:'+(g?g.o+' – '+g.c:'')+(p.open&&p.hours?'  '+p.hours:'')+(!g&&p.hours?p.hours:''));if(p.closedDays?.length)info.push('🚫 公休:'+p.closedDays.map(n=>'週'+'日一二三四五六'[n]).join('、'));if(p.remind)info.push('🔔 閉館前 '+p.remind+' 分提醒');const tl=TK.filter(t=>p.tickets?.[t]?.on),tot=tl.reduce((a,t)=>a+(+p.tickets[t].price||0)*(+p.tickets[t].qty||1),0);if(tl.length)info.push('🎫 票價:'+tl.map(t=>t+' $'+(p.tickets[t].price||'?')+'×'+(p.tickets[t].qty||1)+'人').join('、')+'\n💰 門票總價:$'+tot);if(p.ticket)info.push('📝 門票備註:'+p.ticket);if(p.notes)info.push('⚠️ 注意:'+p.notes)}
 return `<div class="card ${cls}" id="c_${lodge?'lodge':p.id}"><div class="row"><span class="name">${lodge?'🏨 今日住宿:':''}<a class="nl" href="${esc(mapLink(p))}" target="_blank" rel="noopener" title="在 Google Maps 查看">${esc(p.name)} ↗</a></span>${p.act?'<span class="tag act">🏷 '+esc(p.act)+'</span>':''}${p.venue?'<span class="tag vt">🏛 營運場地</span>':''}${h?`<span class="tag ${h.c}">${h.t}</span>`:''}
 ${!lodge?``:''}</div>
 <div class="row acts"><a class="nav" href="${esc(mapLink(p))}" target="_blank" rel="noopener">📍導航</a>${!lodge?`<button class="st st-${p.status}" ${p.status==='todo'?'':'disabled'} onclick="arrive('${p.id}')">${{done:'離開',current:'我到了',todo:'前往'}[p.status]}</button>`:''}
 
 ${!lodge&&p.status!=='todo'?`<button onclick="setStatus('${p.id}','todo')">還原</button>`:''}
 ${!lodge?`<button onclick="move('${p.id}',-1)">↑</button><button onclick="move('${p.id}',1)">↓</button><button onclick="mv('${p.id}')">📦搬移</button>`:''}
 ${lodge?'<button onclick="stay()">續住</button>':''}<button onclick="edit('${lodge?'lodge':p.id}',${lodge})">編輯</button>${!lodge?`<button onclick="delPlace('${p.id}')" style="color:#b00020;margin-left:auto">🗑 刪除</button>`:''}</div>${info.length?`<div class="info">${esc(info.join('\n'))}</div>`:''}</div>`}

const mvdlg=$('mvdlg');
function mv(id){const all=dayList(),L=all.filter(x=>x!==date);if(!L.length)return alert('請先在「📅行程」設定起訖日(至少兩天)');mvId=id;
 $('m_sel').innerHTML=L.map(x=>`<option value="${x}">第${all.indexOf(x)+1}天 ${x.slice(5).replace('-','/')}</option>`).join('');mvdlg.showModal()}
function doMove(){const d=day(),p=d.places.find(x=>x.id===mvId),t=$('m_sel').value;d.places=d.places.filter(x=>x!==p);p.status='todo';(db.days[t]||(db.days[t]={lodging:null,places:[]})).places.push(p);save();mvdlg.close();render()}
function goto(id){const e=$('c_'+id);if(!e)return;e.scrollIntoView({behavior:'smooth',block:'center'});e.classList.add('flash');setTimeout(()=>e.classList.remove('flash'),1500)}
function delPlace(id){const d=day(),p=d.places.find(x=>x.id===id);if(!confirm('確定刪除「'+p.name+'」?'))return;d.places=d.places.filter(x=>x.id!==id);save();render()}
const TK=['全票','半票','老人票','學生票'],times=[];for(let m=0;m<=1440;m+=15)times.push(pad(m/60|0)+':'+pad(m%60));
$('f_open').innerHTML='<option value="">未設定</option>'+times.slice(0,96).map(t=>`<option>${t}</option>`).join('');
$('f_close').innerHTML='<option value="">未設定</option>'+times.map(t=>`<option>${t}</option>`).join('');
$('tk').innerHTML=TK.map((t,i)=>`<div class="row"><label style="margin:0;flex:1;font-size:16px"><input type="checkbox" id="tk_on${i}" onchange="tkTog(${i})"> ${t}</label><input type="number" min="0" id="tk_p${i}" placeholder="票價" oninput="calcTk()" style="width:90px" disabled><input type="number" min="1" id="tk_q${i}" placeholder="人數" value="1" oninput="calcTk()" style="width:70px" disabled></div>`).join('');
function tkTog(i){const c=$('tk_on'+i).checked;$('tk_p'+i).disabled=!c;$('tk_q'+i).disabled=!c;calcTk()}
function calcTk(){let t=0;TK.forEach((x,i)=>{if($('tk_on'+i).checked)t+=(+$('tk_p'+i).value||0)*(+$('tk_q'+i).value||1)});$('tkTotal').textContent='💰 總價:$'+t}
render();initFile();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js');
</script></body></html>
